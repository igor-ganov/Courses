<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cybernetica — офлайн</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #080c18;
        color: #e8ecf7;
        font-family: 'Inter', system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 460px;
        border: 1px solid #24304f;
        border-radius: 14px;
        padding: 28px;
        background: #0e1424;
      }
      h1 { font-size: 1.4rem; margin: 0 0 12px; }
      p { color: #a4b0cc; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 14px;
        padding: 9px 16px;
        border-radius: 10px;
        background: #7c6cff;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Эта страница ещё не попала в кэш</h1>
      <p>
        Платформа работает офлайн, но конкретно этот адрес не сохранён. Откройте приложение с главной — всё
        остальное уже загружено на устройство.
      </p>
      <a href="./">На главную</a>
    </div>
  </body>
</html>
