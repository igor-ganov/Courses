name: Pages

on:
  push:
    branches: [claude/cybernetics-interactive-platform-j5tbo7]
    paths: ['design/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp -r design/fonts design/mockups design/materia.js design/grana.png design/piega.png _site/
          cp design/mostra.html _site/index.html
          touch _site/.nojekyll

      # Pages здесь классические, из ветки: токен Actions не имеет права
      # создать сайт через API, а ветка gh-pages включает его сама.
      - name: Выложить в gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Витрина направлений: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
