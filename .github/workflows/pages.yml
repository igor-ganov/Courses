name: Pages

on:
  push:
    branches: [claude/cybernetics-interactive-platform-j5tbo7]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Выкладывать непроверенное незачем: тетрадь обещает работать без сети и в
  # ладони, и оба обещания проверяются здесь, до выкладки, а не после.
  proverki:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Типы
        run: npx tsc --noEmit

      - name: Модульные проверки
        run: npm test

      - name: Собрать
        run: npm run build
        env:
          PAGES_BASE: /Courses/

      - name: Поставить браузер
        run: npx playwright install --with-deps chromium

      - name: Сквозные проверки
        run: npx playwright test
        env:
          PAGES_BASE: /Courses/

      # Оба замера ниже идут по одному и тому же поднятому сайту, поэтому он
      # поднимается отдельным шагом и переживает шаг: nohup с отвязкой, иначе
      # оболочка шага уносит его с собой.
      - name: Поднять собранное
        run: |
          nohup npx astro preview --port 4321 --host 127.0.0.1 > preview.log 2>&1 &
          disown
          npx wait-on -t 60000 http://127.0.0.1:4321/Courses/
        env:
          PAGES_BASE: /Courses/

      # Оценки Lighthouse — такая же проверка, как остальные: падает, если
      # хоть одна ниже сотни. Без неё они молча съезжают от любой мелочи —
      # лишний шрифт на критическом пути, скрипт, поехавшая шапка.
      - name: Оценки Lighthouse
        run: node scripts/faro.mjs
        env:
          PAGES_BASE: /Courses/

      # Lighthouse меряет загрузку, а не листание. Прокрутку пальцем нужно
      # мерить отдельно: именно её однажды и утопила освещённая бумага —
      # 46 мс на кадр вместо 17, и ни одна проверка этого не показывала.
      - name: Листание пальцем
        run: node scripts/scorrimento.mjs
        env:
          PAGES_BASE: /Courses/

      # А листание меряет длину кадра на главном потоке — и слепо к тому, что
      # стоит в растеризации. Перспектива на весь лист, режим смешивания и
      # непродвинутый слой прошли листание насквозь, а страница при этом
      # доезжала во вьюпорт с задержкой: 855 мс перекраски на десять прыжков
      # против 102 без бумаги.
      - name: Перекраска при прокрутке
        run: node scripts/vernice.mjs
        env:
          PAGES_BASE: /Courses/

      - name: Отчёт о сквозных проверках
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: playwright-report
          retention-days: 7

      - name: Сохранить собранное
        uses: actions/upload-artifact@v4
        with:
          name: sito
          path: dist
          retention-days: 1

  vylozhit:
    name: Выложить
    needs: proverki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sito
          path: _site

      - name: Показать направления дизайна рядом с тетрадью
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Собрать витрину
        run: |
          mkdir -p _site/design
          cp -r repo/design/fonts repo/design/mockups repo/design/materia.js \
                repo/design/grana.png _site/design/
          cp repo/design/mostra.html _site/design/index.html
          cp repo/design/geometria.html repo/design/tocchi.html _site/design/
          touch _site/.nojekyll

      # Pages здесь классические, из ветки: токен Actions не имеет права
      # создать сайт через API, а ветка gh-pages включает его сама.
      - name: Выложить в gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Тетрадь: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
